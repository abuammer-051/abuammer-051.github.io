<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f4bbc">
  <title>StampCam</title>
  <meta name="description" content="StampCam turns photos into postage-style stamps and personal scrapbooks.">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #faf8ff; color: #292335; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100%, 720px); padding: 48px 24px; }
    .mark { display: grid; place-items: center; width: 76px; height: 76px; background: #6f4bbc; color: white; font-size: 36px; border-radius: 22px; box-shadow: 0 12px 28px #6f4bbc33; }
    h1 { margin: 32px 0 12px; font-size: clamp(42px, 8vw, 72px); letter-spacing: -.05em; }
    p { max-width: 550px; font-size: 19px; line-height: 1.6; color: #625b6d; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    a { display: inline-block; padding: 12px 17px; border-radius: 12px; background: #eee7fc; color: #55359d; font-weight: 650; text-decoration: none; }
    a:hover, a:focus-visible { background: #dfd2f9; }
    footer { margin-top: 64px; color: #77717d; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✂</div>
    <h1>StampCam</h1>
    <p>Turn everyday photos into postage-style stamps. Keep the full photo, collect your stamps, and arrange them in personal scrapbooks.</p>
    <nav aria-label="StampCam information">
      <a href="https://sites.google.com/view/stampcam-privacy-and-terms/privacy-policy">Privacy policy</a>
      <a href="https://sites.google.com/view/stampcam-privacy-and-terms/terms-of-use">Terms of use</a>
      <a href="mailto:abuammeriiii@gmail.com">Support</a>
    </nav>
    <footer>StampCam for Android · Developer contact: abuammeriiii@gmail.com</footer>
  </main>
</body>
</html>
